<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Manufacturer: Space Factory Idle</title>
  <meta name="description" content="Build, optimize, and automate your 2D space factory, launch rockets, explore deep space, and grow your aerospace empire!" />
  <meta name="theme-color" content="#001437" />
  <!-- Ana ekrana eklenince tarayıcı çubukları olmadan, tam ekran açılır -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <!-- CrazyGames SDK v3 (Resmi HTML5 SDK Entegrasyonu) -->
  <script src="https://sdk.crazygames.com/crazygames-sdk-v3.js"></script>

  <style>
    :root {
      --px-bg-deep: #001437;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--px-bg-deep);
    }
    #game-container {
      width: 100%;
      height: 100%;
      touch-action: none;
    }
    canvas {
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
  </style>
</head>
<body>
  <div id="game-container"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
